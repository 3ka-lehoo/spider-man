<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pókember-követő chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Silkscreen', 'Press Start 2P', cursive;
            user-select: none;
            -webkit-user-select: none;
        }

        input, textarea {
            user-select: text;
            -webkit-user-select: text;
        }

        /* Pixelated rendering style */
        .pixelated {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Custom Retro Bezel Borders */
        .pixel-border-bezel {
            box-shadow: 
                inset 0 0 0 4px #81beeb,
                inset 0 0 0 8px #3275a8,
                inset 0 0 0 12px #184873,
                0 10px 0 0 #0d2740,
                0 15px 25px rgba(0,0,0,0.5);
        }

        .pixel-box-shadow {
            box-shadow: 3px 3px 0px #0d2740;
        }

        .pixel-box-shadow-sm {
            box-shadow: 2px 2px 0px #000000;
        }

        /* Retro CRT Scanline Overlay */
        .scanlines {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.02),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.02)
            );
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* Custom Pixel Scrollbar for Chat */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0b131c;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #3275a8;
            border: 2px solid #0b131c;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #81beeb;
        }

        /* Screen Background Grid Pattern */
        .spider-bg {
            background-color: #0b131c;
            background-image: radial-gradient(#1e3a5a 1px, transparent 1px);
            background-size: 10px 10px;
        }

        /* Chat bubble animations */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .chat-bubble-anim {
            animation: popIn 0.15s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-2 md:p-6 overflow-x-hidden">

    <div class="relative w-full max-w-[420px] h-[92vh] max-h-[820px] bg-[#5ba4d9] rounded-2xl p-4 flex flex-col justify-between border-4 border-[#81beeb] pixel-border-bezel select-none">

        <div class="relative z-20 flex items-center justify-between mb-2">
            <!-- Pókérzék gomb -->
            <button id="btn-spidey-eyes" title="Pókérzék!" class="w-11 h-11 bg-black border-4 border-[#f08519] rounded-full flex items-center justify-center pixel-box-shadow p-1 hover:scale-105 active:translate-y-0.5 transition-all">
                <div class="w-full h-full bg-white rounded-full flex items-center justify-around px-1 py-1.5">
                    <div class="w-2.5 h-4 bg-black rounded-full transform -rotate-12"></div>
                    <div class="w-2.5 h-4 bg-black rounded-full transform rotate-12"></div>
                </div>
            </button>

            <!-- Fejléc -->
            <div class="bg-[#183957] border-2 border-[#81beeb] text-white px-3 py-1.5 rounded flex items-center gap-2 pixel-box-shadow">
                <span class="text-[10px] sm:text-xs text-[#81beeb] tracking-tighter">SPIDEY</span>
                <!-- Mini Spidey Icon -->
                <div class="w-5 h-5 bg-red-600 rounded-full border border-black flex items-center justify-center p-0.5 relative">
                    <div class="w-1.5 h-2 bg-white rounded-full -rotate-12"></div>
                    <div class="w-1.5 h-2 bg-white rounded-full rotate-12"></div>
                </div>
                <span class="text-[10px] sm:text-xs text-[#81beeb] tracking-tighter">KÖVETŐ</span>
            </div>

            <!-- Beszélgetés törlése -->
            <button id="btn-clear-chat" title="Törlés" class="w-10 h-10 bg-slate-100 hover:bg-white border-2 border-slate-800 rounded-lg flex items-center justify-center pixel-box-shadow active:translate-y-0.5 transition-all">
                <svg class="w-6 h-6 text-black" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C11.4 2 11 2.4 11 3V5H9C8.4 5 8 5.4 8 6V8H6C5.4 8 5 8.4 5 9V11H3C2.4 11 2 11.4 2 12C2 12.6 2.4 13 3 13H5V15H8V17H11V21C11 21.6 11.4 22 12 22C12.6 22 13 21.6 13 21V17H16V15H19V13H21C21.6 13 22 12.6 22 12C22 11.4 21.6 11 21 11H19V9H18V8C18 7.4 17.6 7 17 7H16V5H13V3C13 2.4 12.6 2 12 2ZM11 7H13V9H11V7ZM9 10H15V14H9V10Z"/>
                </svg>
            </button>
        </div>

        <div class="absolute left-[-18px] top-24 flex flex-col gap-3 z-30">
            <button id="tab-quick-1" title="Gyors üzenet: S.O.S." class="w-8 h-8 bg-slate-100 hover:bg-white border-2 border-slate-800 rounded-l-md flex items-center justify-center pixel-box-shadow-sm active:translate-x-0.5">
                <span class="text-[9px] font-bold text-black">!</span>
            </button>
        </div>

        <div class="relative flex-1 bg-[#0b131c] border-4 border-[#12283b] rounded-lg overflow-hidden flex flex-col spider-bg mb-2">
            <!-- Képernyőcsíkok -->
            <div class="absolute inset-0 scanlines z-20"></div>

            <!-- Halvány háttérminta -->
            <div class="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none z-0">
                <svg class="w-3/4 h-3/4 text-[#5ba4d9]" viewBox="0 0 100 100" fill="currentColor">
                    <path d="M48 10 h4 v10 h-4 z M40 15 h4 v10 h-4 z M56 15 h4 v10 h-4 z M30 25 h8 v6 h-8 z M62 25 h8 v6 h-8 z M20 35 h12 v6 h-12 z M68 35 h12 v6 h-12 z M15 45 h10 v6 h-10 z M75 45 h10 v6 h-10 z M45 35 h10 v30 h-10 z M35 45 h30 v15 h-30 z M20 65 h10 v6 h-10 z M70 65 h10 v6 h-10 z M25 75 h10 v6 h-10 z M65 75 h10 v6 h-10 z M35 85 h8 v8 h-8 z M57 85 h8 v8 h-8 z"/>
                </svg>
            </div>

            <!-- Status Indicator -->
            <div class="relative z-10 px-3 py-1.5 bg-[#080d14]/80 border-b border-[#183957] flex justify-between items-center text-[9px] text-[#81beeb]">
                <div class="flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>ELÉRHETŐ: KÖZÖS CHAT</span>
                </div>
                <span id="chat-status" class="text-slate-400">BIZTONSÁGOS CSATORNA</span>
            </div>

            <!-- Görgethető üzenetlista -->
            <div id="chat-history" class="relative z-10 flex-1 p-3 overflow-y-auto custom-scrollbar flex flex-col gap-3">
            </div>
        </div>

        <div class="relative z-20 flex flex-col gap-2 pt-1">
            <!-- Top Controls Row -->
            <div class="flex items-center gap-2">
                <!-- Állapotjelzés -->
                <div class="flex-1 bg-[#0b131c] border-2 border-[#183957] rounded-lg h-9 flex items-center px-3 pixel-box-shadow">
                    <span id="display-text" class="text-[10px] sm:text-xs text-[#81beeb] tracking-wider truncate">KAPCSOLATRA KÉSZ</span>
                </div>

                <!-- Hang be- és kikapcsolása -->
                <button id="btn-sound" title="Hang ki/be" class="w-9 h-9 bg-slate-100 hover:bg-white border-2 border-slate-800 rounded-lg flex items-center justify-center pixel-box-shadow active:translate-y-0.5 transition-transform">
                    <svg id="sound-icon" class="w-5 h-5 text-black" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                </button>
            </div>

            <!-- Üzenetküldő űrlap -->
            <form id="chat-form" class="flex items-center gap-2">
                <input 
                    type="text" 
                    id="chat-input" 
                    placeholder="Üzenet írása..." 
                    maxlength="80"
                    autocomplete="off"
                    class="flex-1 bg-[#080d14] border-2 border-[#3275a8] focus:border-[#81beeb] text-[#e0f2fe] placeholder-slate-500 text-[10px] sm:text-xs px-3 py-2.5 rounded-lg outline-none pixel-box-shadow"
                />
                
                <!-- Send Button -->
                <button 
                    type="submit" 
                    id="btn-send"
                    class="bg-[#f08519] hover:bg-[#ff9426] text-black font-bold text-[10px] px-3 py-2.5 rounded-lg border-2 border-black pixel-box-shadow active:translate-y-0.5 transition-all flex items-center justify-center gap-1"
                >
                    <span>KÜLDÉS</span>
                    <svg class="w-3.5 h-3.5 text-black" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
                    </svg>
                </button>
            </form>

            <!-- Alsó felirat -->
            <div class="flex justify-between items-center px-1 mt-0.5">
                <div id="btn-spidey-tab" class="cursor-pointer bg-[#f08519] hover:bg-[#ff9426] border-2 border-black rounded-b-md px-3 py-0.5 text-[8px] text-black font-bold pixel-box-shadow-sm active:translate-y-0.5">
                    SPIDEY-NET
                </div>
                <span class="text-[8px] text-[#184873] font-bold">2.0-S CHAT</span>
            </div>
        </div>
    </div>

    <script>
        // Hangeffektek beállítása.
        let soundEnabled = true;
        const synth = new Tone.Synth({
            oscillator: { type: 'square' },
            envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 }
        }).toDestination();

        function playSendSound() {
            if (!soundEnabled) return;
            try {
                if (Tone.context.state !== 'running') Tone.start();
                synth.triggerAttackRelease("C6", "16n");
            } catch (e) { console.log(e); }
        }

        function playClickSound() {
            if (!soundEnabled) return;
            try {
                if (Tone.context.state !== 'running') Tone.start();
                synth.triggerAttackRelease("E5", "32n");
            } catch (e) { console.log(e); }
        }

        // Az oldal elemei és a chat állapota.
        const chatHistory = document.getElementById('chat-history');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const displayText = document.getElementById('display-text');
        const btnSound = document.getElementById('btn-sound');
        const chatStatus = document.getElementById('chat-status');
        const chatServiceUrl = 'chatservice.php';
        const seenMessageIds = new Set();
        let currentUsername = '';
        let lastMessageId = 0;
        let isLoadingMessages = false;

        // A legfrissebb üzenetre görget.
        function scrollToBottom() {
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // Biztonságosan megjelenít egy chatüzenetet.
        function addMessage(item) {
            const sender = String(item.sender_name || 'Ismeretlen');
            const isOwnMessage = sender === currentUsername;
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start gap-2 max-w-[85%] chat-bubble-anim ${isOwnMessage ? 'self-end flex-row-reverse' : ''}`;

            const avatar = document.createElement('div');
            avatar.className = `w-7 h-7 ${isOwnMessage ? 'bg-blue-600' : 'bg-red-600'} border border-black rounded flex-shrink-0 flex items-center justify-center text-[8px] font-bold text-white mt-0.5`;
            avatar.textContent = isOwnMessage ? 'TE' : sender.slice(0, 2).toUpperCase();

            const bubble = document.createElement('div');
            bubble.className = `border-2 ${isOwnMessage ? 'bg-[#2a4d6c] border-[#5ba4d9] rounded-tr-none' : 'bg-[#183957] border-[#3275a8] rounded-tl-none'} text-[#e0f2fe] text-[10px] p-2 rounded-lg leading-relaxed pixel-box-shadow-sm break-words`;

            const senderLabel = document.createElement('p');
            senderLabel.className = `font-bold mb-1 text-[8px] ${isOwnMessage ? 'text-[#81beeb] text-right' : 'text-[#f08519]'}`;
            senderLabel.textContent = isOwnMessage ? 'TE' : sender;

            const messageText = document.createElement('p');
            messageText.className = 'whitespace-pre-wrap';
            messageText.textContent = String(item.message || '');

            bubble.append(senderLabel, messageText);
            wrapper.append(avatar, bubble);

            chatHistory.appendChild(wrapper);
            scrollToBottom();
        }

        // Lekéri a chat új üzeneteit.
        async function loadMessages(afterId = lastMessageId) {
            if (isLoadingMessages || !currentUsername) return;
            isLoadingMessages = true;

            try {
                const response = await fetch(`${chatServiceUrl}?after=${afterId}`, {
                    credentials: 'same-origin',
                    cache: 'no-store'
                });
                if (response.status === 401) {
                    window.location.href = 'login.html';
                    return;
                }
                if (!response.ok) throw new Error('Nem sikerült betölteni a közös chatet.');

                const messages = await response.json();
                messages.forEach((item) => {
                    const id = Number(item.id);
                    const idKey = String(item.id);
                    if (!seenMessageIds.has(idKey)) {
                        addMessage(item);
                        seenMessageIds.add(idKey);
                    }
                    if (Number.isFinite(id)) lastMessageId = Math.max(lastMessageId, id);
                });
                chatStatus.textContent = 'CSATLAKOZVA';
            } catch (error) {
                console.error(error);
                chatStatus.textContent = 'ÚJRACSATLAKOZÁS...';
            } finally {
                isLoadingMessages = false;
            }
        }

        // Elküldi a megadott üzenetet a közös chatbe.
        async function handleSendMessage(text) {
            const fromInput = typeof text !== 'string';
            const message = (fromInput ? chatInput.value : text).trim();
            if (!message || !currentUsername) return;

            try {
                const response = await fetch(chatServiceUrl, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const result = await response.json();
                if (response.status === 401) {
                    window.location.href = 'login.html';
                    return;
                }
                if (!response.ok) throw new Error(result.error || 'Nem sikerült elküldeni az üzenetet.');

                const idKey = String(result.id);
                if (!seenMessageIds.has(idKey)) {
                    addMessage(result);
                    seenMessageIds.add(idKey);
                }
                if (fromInput) chatInput.value = '';
                playSendSound();
                displayText.innerText = 'ÜZENET ELKÜLDVE';
                loadMessages(lastMessageId);
            } catch (error) {
                console.error(error);
                displayText.innerText = 'SIKERTELEN KÜLDÉS';
            }
        }

        // Űrlap elküldése.
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            handleSendMessage();
        });

        // Hang be- és kikapcsolása.
        btnSound.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                btnSound.classList.remove('opacity-50');
                displayText.innerText = "HANG: BE";
                playClickSound();
            } else {
                btnSound.classList.add('opacity-50');
                displayText.innerText = "HANG: KI";
            }
        });

        // Üzenetek törlése a képernyőről.
        document.getElementById('btn-clear-chat').addEventListener('click', () => {
            playClickSound();
            chatHistory.innerHTML = '';
            displayText.innerText = "BESZÉLGETÉS TÖRÖLVE";
        });

        // Pókérzék gomb visszajelzése.
        document.getElementById('btn-spidey-eyes').addEventListener('click', () => {
            playClickSound();
            displayText.innerText = "PÓKÉRZÉK AKTÍV!";
        });

        // Gyors SOS-üzenet.
        document.getElementById('tab-quick-1').addEventListener('click', () => {
            handleSendMessage('S.O.S. Segítségre van szükségem!');
        });

        document.getElementById('btn-spidey-tab').addEventListener('click', () => {
            playClickSound();
            displayText.innerText = "FREKVENCIA: 104,8 MHz";
        });

        // Ellenőrzi a munkamenetet, majd elindítja a chat frissítését.
        async function initializeChat() {
            try {
                const response = await fetch(`${chatServiceUrl}?action=session`, {
                    credentials: 'same-origin',
                    cache: 'no-store'
                });
                if (response.status === 401) {
                    window.location.href = 'login.html';
                    return;
                }
                if (!response.ok) throw new Error('Nem sikerült ellenőrizni a bejelentkezést.');

                const session = await response.json();
                currentUsername = session.username;
                chatStatus.textContent = 'CSATLAKOZVA';
                displayText.innerText = `BELÉPVE: ${currentUsername}`;
                await loadMessages(0);
                window.setInterval(() => loadMessages(), 2000);
            } catch (error) {
                console.error(error);
                chatStatus.textContent = 'KAPCSOLÓDÁSI HIBA';
                displayText.innerText = 'ELLENŐRIZD A SZERVERKAPCSOLATOT';
            }
        }

        initializeChat();
    </script>
</body>
</html>
